  /debts/time-to-pay/cancel:
    post:
      tags:
        - debts
      summary: Notify cancellation of TTP Plan to downstream HoDs
      operationId: NotifyCancellationOfTTPPlan
      description: |
        An API called by CDCS to trigger the TTP service to notify HoDs (via different APIs) when a TTP set up either by an operator or the self serve journey has been cancelled.

        Response Behavior:
        - Returns HTTP 200 when all downstream HoDs are called and responses can be parsed successfully (regardless of individual HoD response status codes)
        - Returns HTTP 500 only for internal TTP errors or when responses from downstream APIs cannot be parsed
        - The response includes details of all HoDs called with their status codes to help operators determine any required manual steps
      parameters:
        - name: correlationId
          in: header
          description: Correlation Id used for end-to-end traceability
          required: true
          schema:
            type: string
            format: uuid
            example: f0bd1f32-de51-45cc-9b18-0520d6e3ab1a
      security:
        - applicationRestricted:
            - write:time-to-pay
      requestBody:
        description: Request body containing cancellation and identification details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            examples:
              exampleR1:
                summary: Release 1 Example Request (CESA only)
                value:
                  identifications:
                    - idType: UTR
                      idValue: '1234567890'
                  paymentPlan:
                    arrangementAgreedDate: '2025-05-01'
                    ttpEndDate: '2025-11-01'
                    initialPaymentDate: '2025-05-05'
                    initialPaymentAmount: 150
                    frequency: monthly
                    cancellationDate: '2025-10-15'
                  instalments:
                    - dueDate: '2025-06-01'
                      amountDue: 300
                    - dueDate: '2025-07-01'
                      amountDue: 300
                    - dueDate: '2025-08-01'
                      amountDue: 300
                  channelIdentifier: advisor
                  transitioned: true
      responses:
        '200':
          description: |
            Cancellation notification processed successfully. All downstream HoDs were called and responses were parsed successfully.
            Individual HoD APIs may have returned success or error status codes - this is reported in the apisCalled array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
              examples:
                allHoDsSuccessful:
                  summary: All downstream HoDs respond successfully (HTTP 200)
                  value:
                    apisCalled:
                      - name: CESA
                        statusCode: 200
                        processingDateTime: '2025-05-01T14:30:00Z'
                      - name: ETMP
                        statusCode: 201
                        processingDateTime: '2025-05-01T14:31:00Z'
                    processingDateTime: '2025-10-15T10:31:00Z'
        '400':
          description: Bad request due to invalid or missing data in the request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                errorMessage: A user with no active session will return 401 response
        '500':
          description: Internal TTP error or failure to parse responses from downstream HoDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelErrorResponse'
        '503':
          description: The server is temporarily unavailable due to overload or maintenance.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 503
                errorMessage: The server is temporarily unavailable.
  /debts/time-to-pay/inform:
    post:
      tags:
        - debts
      summary: Inform HoDs of SA TTP Operator-led Plan (CESA + ETMP)
      operationId: InformHoDsOfSATTPOperatorLedPlan
      description: |
        An API called by CDCS to inform HoDs (CESA + ETMP) when a TTP set up by an operator has been created.

        Response Behavior:
        - Returns HTTP 200 when all downstream HoDs are called and responses can be parsed successfully (regardless of individual HoD response status codes)
        - Returns HTTP 500 only for internal TTP errors or when responses from downstream APIs cannot be parsed
        - The response includes details of all HoDs called with their status codes to help operators determine any required manual steps
      parameters:
        - name: correlationId
          in: header
          description: Correlation Id used for end to end traceability
          required: true
          schema:
            type: string
            format: uuid
            example: f0bd1f32-de51-45cc-9b18-0520d6e3ab1a
      security:
        - applicationRestricted:
            - read:time-to-pay
      requestBody:
        description: Request body with fields to create a TTP in CESA and ETMP.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformRequest'
            examples:
              example:
                summary: Sample request for Inform API
                value:
                  identifications:
                    - idType: UTR
                      idValue: '1234567890'
                  paymentPlan:
                    arrangementAgreedDate: '2025-05-01'
                    ttpEndDate: '2025-11-01'
                    initialPaymentDate: '2025-05-05'
                    initialPaymentAmount: 150
                    frequency: monthly
                    ddiReference: 'DD123456789'
                    debtItemCharges:
                      - debtItemChargeId: XW006559808862
                        chargeSource: CESA
                  instalments:
                    - dueDate: '2025-06-01'
                      amountDue: 300
                  channelIdentifier: advisor
                  transitioned: true
      responses:
        '200':
          description: |
            Inform API operation successful with results of calls to CESA and ETMP. All downstream HoDs were called and responses were parsed successfully.
            Individual HoD APIs may have returned success or error status codes - this is reported in the apisCalled array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformResponse'
        '400':
          description: Bad request due to invalid or missing data in the request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                errorMessage: A user with no active session will return 401 response
        '500':
          description: Internal TTP error or failure to parse responses from downstream HoDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformErrorResponse'
        '503':
          description: The server is temporarily unavailable due to overload or maintenance.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 503
                errorMessage: The server is temporarily unavailable.
  /debts/time-to-pay/full-amend:
    post:
      tags:
        - debts
      summary: Full amend TTP plan and inform HoDs
      operationId: FullAmendTTPPlanAndInformHoDs
      description: |
        An API called by CDCS to perform a full amendment of a TTP plan and inform HoDs (CESA + ETMP) of the changes.

        Response Behavior:
        - Returns HTTP 200 when all downstream HoDs are called and responses can be parsed successfully (regardless of individual HoD response status codes)
        - Returns HTTP 500 only for internal TTP errors or when responses from downstream APIs cannot be parsed
        - The response includes details of all HoDs called with their status codes to help operators determine any required manual steps
      parameters:
        - name: correlationId
          in: header
          description: Correlation Id used for end to end traceability
          required: true
          schema:
            type: string
            format: uuid
            example: f0bd1f32-de51-45cc-9b18-0520d6e3ab1a
      security:
        - applicationRestricted:
            - write:time-to-pay
      requestBody:
        description: Request body with fields to amend a TTP in CESA and ETMP.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullAmendRequest'
            examples:
              opLedExample:
                summary: Sample request for Op-led TTP amendment
                value:
                  identifications:
                    - idType: UTR
                      idValue: '1234567890'
                  originalPaymentPlan:
                    arrangementAgreedDate: '2025-05-01'
                    ttpEndDate: '2025-11-01'
                    initialPaymentDate: '2025-05-05'
                    initialPaymentAmount: 150
                    frequency: monthly
                    ddiReference: DD123456789
                    debtItemCharges:
                      - debtItemChargeId: XW006559808862
                        chargeSource: CESA
                      - debtItemChargeId: XW006559808863
                        chargeSource: ETMP
                  newPaymentPlan:
                    arrangementAgreedDate: '2025-05-01'
                    ttpEndDate: '2025-12-01'
                    initialPaymentDate: '2025-05-05'
                    initialPaymentAmount: 200
                    frequency: monthly
                    ddiReference: DD123456789
                    debtItemCharges:
                      - debtItemChargeId: XW006559808862
                        chargeSource: CESA
                        chargeAmendment: remain
                      - debtItemChargeId: XW006559808863
                        chargeSource: ETMP
                        chargeAmendment: removed
                      - debtItemChargeId: XW006559808864
                        chargeSource: ETMP
                        chargeAmendment: new
                  instalments:
                    - dueDate: '2025-06-01'
                      amountDue: 300
                    - dueDate: '2025-07-01'
                      amountDue: 300
                  channelIdentifier: advisor
                  transitioned: true
              ssttpExample:
                summary: Sample request for SSTTP amendment
                value:
                  identifications:
                    - idType: UTR
                      idValue: '9876543210'
                  originalPaymentPlan:
                    arrangementAgreedDate: '2025-05-01'
                    ttpEndDate: '2025-11-01'
                    initialPaymentDate: '2025-05-05'
                    initialPaymentAmount: 200
                    frequency: weekly
                    ddiReference: DD987654321
                    debtItemCharges:
                      - debtItemChargeId: XW006559808870
                        chargeSource: ETMP
                  newPaymentPlan:
                    arrangementAgreedDate: '2025-05-01'
                    ttpEndDate: '2025-12-01'
                    initialPaymentDate: '2025-05-05'
                    initialPaymentAmount: 250
                    frequency: weekly
                    ddiReference: DD987654321
                    debtItemCharges:
                      - debtItemChargeId: XW006559808870
                        chargeSource: ETMP
                        chargeAmendment: remain
                      - debtItemChargeId: XW006559808871
                        chargeSource: ETMP
                        chargeAmendment: new
                  instalments:
                    - dueDate: '2025-06-01'
                      amountDue: 100
                    - dueDate: '2025-06-08'
                      amountDue: 100
                  channelIdentifier: selfService
                  transitioned: true
      responses:
        '200':
          description: |
            Full amend API operation successful with results of calls to CESA and ETMP. All downstream HoDs were called and responses were parsed successfully.
            Individual HoD APIs may have returned success or error status codes - this is reported in the apisCalled array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullAmendResponse'
              examples:
                allHoDsSuccessful:
                  summary: All downstream HoDs respond successfully (HTTP 200)
                  value:
                    apisCalled:
                      - processingDateTime: '2025-05-01T14:30:00Z'
                        name: CESA
                        statusCode: 200
                      - processingDateTime: '2025-05-01T14:31:00Z'
                        name: ETMP
                        statusCode: 200
                    processingDateTime: '2025-05-01T14:32:00Z'
                allHoDsUnsuccessful:
                  summary: All downstream HoDs respond unsuccessfully but responses parsed (HTTP 200)
                  value:
                    apisCalled:
                      - processingDateTime: '2025-05-01T14:30:00Z'
                        name: CESA
                        statusCode: 500
                        errorResponse: Internal server error in CESA
                      - processingDateTime: '2025-05-01T14:31:00Z'
                        name: ETMP
                        statusCode: 400
                        errorResponse: Invalid amendment payload
                    processingDateTime: '2025-05-01T14:32:00Z'
                mixedHoDsResponse:
                  summary: Mixed success/failure from HoDs but all responses parsed (HTTP 200)
                  value:
                    apisCalled:
                      - processingDateTime: '2025-05-01T14:30:00Z'
                        name: CESA
                        statusCode: 200
                      - processingDateTime: '2025-05-01T14:31:00Z'
                        name: ETMP
                        statusCode: 500
                        errorResponse: Error processing full amend
                    processingDateTime: '2025-05-01T14:32:00Z'
        '400':
          description: |
            Bad request due to invalid or missing data in the request payload.
            This indicates client-side errors that prevent TTP from processing the full amend request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badRequestExample:
                  summary: Invalid request example
                  value:
                    statusCode: 400
                    errorMessage: 'Invalid request payload: missing identifications'
        '401':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                errorMessage: A user with no active session will return 401 response
        '500':
          description: |
            Internal TTP error or failure to parse responses from downstream HoDs.
            This status is returned only when TTP cannot complete its processing or cannot parse HoD responses.
            When individual HoD APIs return errors but responses can be parsed, a 200 status is returned instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullAmendErrorResponse'
              examples:
                internalParsingError:
                  summary: Internal TTP error - cannot parse HoD responses (HTTP 500)
                  value:
                    internalErrors:
                      - message: Could not parse response from calling CESA
                    processingDateTime: '2025-10-15T10:31:00Z'
                mixedSuccessWithInternalError:
                  summary: Some HoDs successful, others unparseable (HTTP 500)
                  value:
                    apisCalled:
                      - processingDateTime: '2025-10-15T10:30:00Z'
                        name: CESA
                        statusCode: 200
                    internalErrors:
                      - message: Could not parse response from calling ETMP
                    processingDateTime: '2025-10-15T10:31:00Z'
        '503':
          description: The server is temporarily unavailable due to overload or maintenance.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 503
                errorMessage: The server is temporarily unavailable.
components:
  securitySchemes:
    userRestricted:
      type: oauth2
      description: |
        HMRC supports OAuth 2.0 for authenticating user restricted API requests using an OAuth 2.0 Bearer Token in the AUTHORIZATION header.
        See https://developer.service.hmrc.gov.uk/api-documentation/docs/authorisation/user-restricted-endpoints for details.
      flows:
        authorizationCode:
          authorizationUrl: https://api.service.hmrc.gov.uk/oauth/authorize
          tokenUrl: https://api.service.hmrc.gov.uk/oauth/token
          refreshUrl: https://api.service.hmrc.gov.uk/oauth/refresh
          scopes: {}
    applicationRestricted:
      type: oauth2
      description: |
        HMRC supports OAuth 2.0 for authenticating application restricted API requests using an OAuth 2.0 Bearer Token in the AUTHORIZATION header.
        See https://developer.service.hmrc.gov.uk/api-documentation/docs/authorisation/application-restricted-endpoints for details.
      flows:
        clientCredentials:
          tokenUrl: https://api.service.hmrc.gov.uk/oauth/token
          scopes:
            read:time-to-pay: read ttp data
            write:time-to-pay: write ttp data
  schemas:
