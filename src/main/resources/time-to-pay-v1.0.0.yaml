openapi: 3.0.3
info:
  title: Time To Pay (TTP)
  description: |
    This API generates quotes and manages plans of debts that are to be paid by an HMRC customer.
    When an API changes in a way that is backwards-incompatible, we increase the version number of the API.
    See our [reference guide](/api-documentation/docs/reference-guide#versioning) for more on versioning.

    We use standard HTTP status codes to show whether an API request succeeded or not. They are usually in the range:
    * 200 to 299 if it succeeded, including code 202 if it was accepted by an API that needs to wait for further action
    * 400 to 499 if it failed because of a client error by your application
    * 500 to 599 if it failed because of an error on our server

    Errors specific to each API are shown in the Endpoints section, under Response.
    See our [reference guide](/api-documentation/docs/reference-guide#errors) for more on errors.
    You can use the [HMRC Developer Sandbox](https://test-developer.service.hmrc.gov.uk/api-documentation/docs/sandbox/introduction)
    to test the API.

    ```
    Change Log
    ```
      | Version | Date | Author | Description |
      |---|-----|------|-----|
      | 1.0.0 | 30-12-2025 | Alex Olkhovskiy | Combined spec from proxy with time-to-pay specific endpoints |
  version: 1.0.0
  contact: {}
servers:
  - url: https://api.service.hmrc.gov.uk
    variables: {}
tags:
  - name: debts
    description: Time To Pay debt management endpoints
paths:
  /debts/time-to-pay/quote:
    post:
      tags:
        - debts
      summary: Generate TTP Quote Request
      description: This is an endpoint that triggers request to generate a quote from TTP service
      operationId: GenerateTTPQuoteRequest
      parameters: []
      security:
        - applicationRestricted:
            - read:time-to-pay
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTPQuoteRequest'
            example:
              regimeType: SA
              customerReference: uniqRef1234
              channelIdentifier: selfService
              plan:
                quoteType: duration
                quoteDate: '2021-05-13'
                instalmentStartDate: '2021-05-13'
                instalmentAmount: 100
                frequency: annually
                duration: 12
                initialPaymentAmount: 100
                initialPaymentDate: '2021-05-13'
                paymentPlanType: timeToPay
              customerPostCodes:
                - addressPostcode: NW9 5XW
                  postcodeDate: '2021-05-13'
              debtItemCharges:
                - debtItemChargeId: debtItemChrgId1
                  mainTrans: '1546'
                  subTrans: '1090'
                  originalDebtAmount: 100
                  interestStartDate: '2021-05-13'
                  paymentHistory:
                    - paymentDate: '2021-05-13'
                      paymentAmount: 100
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTPQuoteResponse'
        '400':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                errorMessage: Invalid JSON error
        '401':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                errorMessage: A user with no active session will return 401 response
        '500':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                errorMessage: Internal Service Error
        '503':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 503
                errorMessage: Couldn't parse body from upstream
      deprecated: false
