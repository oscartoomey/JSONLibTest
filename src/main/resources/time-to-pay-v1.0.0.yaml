          example: XW006559808862
        chargeSource:
          type: string
          description: Source system of the charge. So we know when to call CESA or ETMP.
          enum:
            - CESA
            - ETMP
          example: CESA
    ChannelIdentifier:
      title: ChannelIdentifier
      enum:
        - advisor
        - selfService
      type: string
      description: Attribute to identify where the request is coming
    PlanQuoteType:
      title: PlanQuoteType
      enum:
        - duration
        - instalmentAmount
      type: string
      description: this will determine what IFS is required
    PaymentFrequency:
      title: PaymentFrequency
      enum:
        - single
        - weekly
        - 2Weekly
        - 4Weekly
        - monthly
        - quarterly
        - 6Monthly
        - annually
